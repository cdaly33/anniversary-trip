name: Deploy Azure Static Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site test dependencies
        run: npm --prefix site ci

      - name: Validate approved content
        run: node site/validate-content.js

      - name: Validate map coordinates
        run: node site/validate-coordinates.js

      - name: Install Playwright browser
        run: npx --prefix site playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm --prefix site run test:browser

      - name: Deploy site
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: ""
          output_location: ""
          skip_app_build: true
